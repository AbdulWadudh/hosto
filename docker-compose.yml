services:
  postgres:
    image: postgres:18-alpine
    container_name: hosto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hosto
      POSTGRES_PASSWORD: hosto
      POSTGRES_DB: hosto
    ports:
      - "5432:5432"
    volumes:
      - hosto-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hosto -d hosto"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    container_name: hosto-rustfs
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: hosto
      RUSTFS_SECRET_KEY: hostosecret
    volumes:
      - hosto-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  rustfs-bucket:
    image: amazon/aws-cli:latest
    container_name: hosto-rustfs-bucket
    profiles: ["bootstrap"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: hosto
      AWS_SECRET_ACCESS_KEY: hostosecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket hosto-assets
        || aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket hosto-assets
    restart: "no"

volumes:
  hosto-pgdata:
  hosto-rustfs:
